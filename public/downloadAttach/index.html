<script>
    document.addEventListener("DOMContentLoaded", function() { 
        Init_Download();

    async function Init_Download() {

                //Phân tách
                const paramsId   = urlParams.get('Id');

                const paramsSec  = urlParams.get('Sec');

            const msgContent = document.getElementById('MsgContent');


            // Kiểm tra xem MsgContent có tồn tại trên DOM không để tránh lỗi null
            if (!msgContent) {
                console.error("Không tìm thấy phần tử có id 'MsgContent'");
                return;
            }

            // Kiểm tra tính hợp lệ của Id (phải là số nguyên)
            const isInteger = /^\d+$/.test(paramsId);

            } else {
                msgContent.innerText = "Link không chính xác !";

            `;

        }
    }//❌❌❌❌❌ End Function 





</script>
